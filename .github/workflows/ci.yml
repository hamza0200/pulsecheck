# Continuous integration only: lint, type-check and tests. No deployment happens here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulsecheck_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulsecheck_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pulse:pulse@localhost:5433/pulsecheck_test
      TEST_DATABASE_URL: postgresql://pulse:pulse@localhost:5433/pulsecheck_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      SCHEDULER_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (also runs prisma generate)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Backend tests
        run: npm run test:backend

      - name: Frontend tests
        run: npm run test:frontend
